name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch + onnxruntime)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check src tests scripts

      - name: Tests
        run: pytest -q

      - name: Offline smoke test (synthetic data, no API keys)
        run: python -m pxscalper.cli smoke --arch tcn --steps 3 --rl-steps 300
        env:
          PX_LOG_LEVEL: WARNING

      - name: Smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts-${{ matrix.python-version }}
          path: artifacts/models/smoke/*.json
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "::error::a credential file is tracked"; exit 1
          fi
          echo "no credential files tracked"
