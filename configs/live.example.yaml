# ─────────────────────────────────────────────────────────────────────────────
#  pxscalper -- example live/paper configuration
#  Copy to configs/live.yaml and adjust. Secrets stay in .env, never here.
# ─────────────────────────────────────────────────────────────────────────────

live:
  symbols:
    - EUR/USD
    - GBP/USD
  bar_size: 1M            # 1M | 5M | 15M | 1H ... ("1M" = one minute)
  lookback: 64            # bars fed to the sequence model (must match the export)
  warmup_bars: 900        # history pulled at start for the rolling feature buffer
  settle_ms: 1200         # wait after the bar opens for the feed to print
  loop_sleep_s: 2.5
  max_hold_bars: 45       # bar-based time stop
  trailing_stop_atr: 0.0  # e.g. 0.8 to enable an ATR trailing stop

inference:
  arch: tcn               # tcn | lstm | transformer
  backend: onnx           # onnx | torchscript | torch
  version: latest
  confidence_threshold: 0.45
  edge_threshold: 0.02
  threads: 1              # keep at 1: avoids thread-pool jitter in the hot path

strategy:
  min_confidence: 0.45
  min_edge: 0.03
  require_rl_agreement: true   # set false if you have not trained/evaluated a DRL agent
  rl_neutral_band: 0.15
  size_by_edge: true
  uncertainty_penalty: 0.5
  min_seconds_between_trades: 5.0
  cooldown_after_loss_s: 30.0

risk:
  risk_per_trade_pct: 0.25      # % of equity risked to the stop distance
  max_positions: 2
  max_gross_exposure_pct: 300.0
  max_leverage: 5.0
  sl_atr: 1.0
  tp_atr: 2.0                   # reward:risk 2:1 before costs
  max_holding_bars: 45
  max_daily_loss_pct: 2.0       # breach -> kill switch engages automatically
  max_drawdown_pct: 5.0
  max_daily_trades: 60
  consecutive_loss_cooldown: 3
  cooldown_minutes: 30
  max_spread_bps: 3.0           # no scalp edge above this
  min_atr_bps: 0.8
  max_atr_bps: 30.0
  min_confidence: 0.45
  min_edge: 0.02
  allow_hedging: false
  state_path: state/risk_state.json
  kill_switch_path: state/KILL
  correlated_groups:
    - ["EUR/USD", "GBP/USD", "AUD/USD", "NZD/USD"]   # one USD-bloc position at a time
    - ["USD/JPY", "USD/CHF", "USD/CAD"]

execution:
  use_limit_orders: false       # true = passive/maker entries (may not fill)
  limit_offset_bps: 0.2
  max_spread_bps: 3.0
  attach_protection: true       # stop-loss + take-profit sent WITH the order
  verify_fills: true
  verify_timeout_s: 3.0
  max_impact_vwap_bps: 2.5

backtest:
  initial_equity: 10000
  taker_fee_pct: 0.05
  slippage_coef: 0.05
  risk_per_trade_pct: 0.25
  sl_atr: 1.0
  tp_atr: 2.0
  max_holding_bars: 45
  min_confidence: 0.45
  min_edge: 0.03
  n_bars: 20000
