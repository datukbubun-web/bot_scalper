# ─────────────────────────────────────────────────────────────────────────────
#  pxscalper -- Hybrid Balanced Compound + Kunci Profit Harian +3.0%:
#  Begitu ekuitas hari berjalan naik >= +3.0% dari day_start_equity:
#    1) harvest_daily_profit_target menutup posisi terbuka untuk mengunci profit;
#    2) daily_profit_target_pct menahan pembukaan posisi baru sampai 00:00 UTC;
#    3) hari berikutnya lot dihitung dari saldo baru yang sudah ter-compound.
# ─────────────────────────────────────────────────────────────────────────────

symbols: ["XAU/USD"]
bar_size: "5M"
lookback: 64
horizon: 12

live:
  symbols: ["XAU/USD"]
  bar_size: "5M"
  lookback: 64
  warmup_bars: 1200
  settle_ms: 1200
  loop_sleep_s: 2.5
  max_hold_bars: 12
  trailing_stop_atr: 0.0
  l2_probe_interval_s: 60.0
  l2_probe_ladder: [0.01, 0.1, 1.0, 10.0]

harvest_daily_profit_target: true
close_all_on_profit_pct: 3.0
close_all_enforce: true
close_all_cooldown_s: 300

inference:
  arch: "tcn"
  backend: "onnx"
  model_dir: "artifacts/xau_hybrid_5M"
  confidence_threshold: 0.45
  edge_threshold: 0.03
  threads: 1

strategy:
  kind: "hybrid"
  min_confidence: 0.45
  min_edge: 0.03
  require_rl_agreement: false
  size_by_edge: false
  min_seconds_between_trades: 5.0
  cooldown_after_loss_s: 30.0
  max_hold_bars: 12

hybrid:
  enabled: true
  require_composite_threshold: true
  composite_threshold: 1.85
  require_micro_absorption: false
  modulate_size_by_bias: false
  bias:
    htf_bar_size: "15M"
    htf_rv_col: "htf_15m_xag_rv_z_2"
    ltf_rv_col: "ctx_xag_rv_z_4"
    ltf_weight: 0.65
    htf_weight: 0.35
    max_opposing_session_trend: 0.60
    max_vol_regime_ratio: 1.85
    min_vol_regime_ratio: 0.15
    require_htf_non_opposing: true

risk:
  single_symbol: true
  allowed_symbols: ["XAU/USD"]
  risk_per_trade_pct: 3.0
  compound_mode: "daily"
  daily_profit_target_pct: 3.0
  compound_dd_scale: true
  dd_scale_start_pct: 3.0
  dd_scale_min_factor: 0.50
  max_leverage: 20.0
  max_positions: 1
  max_positions_per_symbol: 1
  max_gross_exposure_pct: 2000.0
  sl_atr: 4.5
  tp_atr: 6.0
  max_holding_bars: 12
  max_intraday_loss_pct: 9.0
  max_daily_loss_pct: 10.5
  max_drawdown_pct: 18.0
  max_total_loss_pct: 25.0
  max_daily_trades: 8
  consecutive_loss_cooldown: 3
  cooldown_minutes: 60
  blackout_enabled: true
  blackout_pre_min: 15
  blackout_post_min: 15
  blackout_kinds: ["nfp", "cpi", "fomc"]
  max_spread_bps: 1.5
  min_atr_bps: 1.5
  max_atr_bps: 15.0
  min_confidence: 0.45
  min_edge: 0.03
  allow_hedging: false

execution:
  use_limit_orders: false
  max_spread_bps: 1.5
  attach_protection: true
  verify_fills: true
  verify_timeout_s: 3.0
  max_impact_vwap_bps: 2.0

backtest:
  initial_equity: 1000.0
  taker_fee_pct: 0.0
  slippage_coef: 0.0
  spread_bps_fallback: 0.65
  align_to_context_span: true
