[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxscalper"
version = "0.1.0"
description = "Institutional-grade FX scalping bot for PrimeXBT: TCN/LSTM/Transformer + PPO/SAC, TorchScript/ONNX low-latency inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pxscalper" }]

dependencies = [
  # runtime
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "cryptography>=42.0",       # Ed25519 request signing (PrimeXBT API v3)
  "requests>=2.31",
  "orjson>=3.9",
  # deep learning / inference
  "torch>=2.2",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  # ops
  "prometheus-client>=0.20",
  "typer>=0.9",
  "rich>=13.7",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.3", "matplotlib>=3.8", "tensorboard>=2.15"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pxs = "pxscalper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
